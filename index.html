<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎪 妖妖_活動公告</title>
  <meta name="description" content="妖妖活動公告｜查看活動座標，一鍵複製座標或下載 GPX。" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="siteUpdateBanner" class="site-update-banner" role="status" aria-live="polite">
    <div class="site-update-banner-text">🌱 網站有新版本，請重新整理取得最新版。</div>
    <button id="reloadLatestBtn" type="button">重新整理</button>
  </div>

  <header>
    <h1>🎪 妖妖活動公告</h1>
    <p>查看活動座標，一鍵複製座標或下載 GPX。</p>
  </header>

  <main class="wrap">
    <section class="topbar">
      <div class="summary">
        <span class="summary-title">活動摘要</span>
        <span id="eventSummaryText" class="summary-text">讀取中...</span>
      </div>
      <button id="adminLoginBtn" class="secondary admin-login-btn">管理員登入</button>
      <button id="logoutBtn" class="ghost admin-login-btn" style="display:none;">管理員登出</button>
    </section>

    <section id="adminPanel" class="admin-panel">
      <div id="adminPanelHeader" class="admin-panel-header" role="button" tabindex="0" aria-expanded="true">
        <h2 class="admin-panel-title">活動座標管理</h2>
        <button id="adminCollapseBtn" class="admin-collapse-btn" type="button">▲</button>
      </div>
      <div class="admin-panel-body">
        <div class="admin-grid">
          <div class="admin-field">
            <label for="eventNameInput">活動名稱</label>
            <input id="eventNameInput" type="text" placeholder="例如：京都活動盆栽">
          </div>
          <div class="admin-field">
            <label for="eventIntervalInput">活動盆間隔</label>
            <select id="eventIntervalInput">
              <option value="1day">每1天一次</option>
              <option value="7days">每7天一次</option>
              <option value="30days">每30天一次</option>
              <option value="monthly1st">每月1號刷新</option>
              <option value="once">活動期間限一次</option>
            </select>
          </div>
          <div class="admin-field">
            <label for="eventStartDateInput">活動開始日期</label>
            <div class="date-time-row">
              <input id="eventStartDateInput" type="date">
              <input id="eventStartTimeInput" type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" autocomplete="off" aria-label="活動開始時間（24小時制，選填）">
            </div>
            <div class="field-subhint">時間選填；未填時間時只記錄日期。</div>
          </div>
          <div class="admin-field">
            <label for="eventEndDateInput">活動結束日期（常駐請留空）</label>
            <div class="date-time-row">
              <input id="eventEndDateInput" type="date">
              <input id="eventEndTimeInput" type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" autocomplete="off" aria-label="活動結束時間（24小時制，選填）">
            </div>
            <div class="field-subhint">時間選填；未填時間時只記錄日期。</div>
          </div>
          <div class="admin-field full">
            <label for="eventCoordsInput">活動座標（每行：名稱;緯度,經度）</label>
            <textarea id="eventCoordsInput" placeholder="台北車站;25.047760,121.517058
西門町;25.042236,121.507987"></textarea>
          </div>
          <div class="admin-field full">
            <label for="eventNoteInput">備註</label>
            <input id="eventNoteInput" type="text" placeholder="例如：每日 00:00 重置">
          </div>
        </div>
        <div class="admin-actions">
          <button id="saveEventBtn" class="green">新增活動</button>
          <button id="clearEventFormBtn" class="ghost">清空輸入</button>
        </div>
        <div class="admin-hint">登入後可新增、編輯與刪除活動。日期必填、時間選填；時間採 24 小時制。常駐活動請將結束日期留空。</div>
      </div>
    </section>

    <div id="loadingMessage" class="empty" style="display:block;">🎪 正在載入活動資料...</div>

    <section id="eventsSection" style="display:none;">
      <div class="result-section-title">活動座標 <span id="eventsCount" class="sub"></span></div>
      <div id="eventsGrid" class="events-grid"></div>
      <div id="permanentEventsTitle" class="result-section-title" style="display:none;">常駐活動 <span id="permanentEventsCount" class="sub"></span></div>
      <div id="permanentEventsGrid" class="events-grid" style="display:none;"></div>
      <div id="endedEventsTitle" class="events-ended-title" style="display:none;">已結束活動</div>
      <div id="endedEventsGrid" class="events-grid" style="display:none;"></div>
      <div id="endedEventsMoreWrap" style="display:none; text-align:center; margin-top:12px;">
        <button id="endedEventsMoreBtn" class="ghost" type="button">顯示更多</button>
      </div>
    </section>

    <div id="eventsEmpty" class="empty">目前沒有活動座標。</div>
  </main>

  <footer class="page-footer-note">活動資料以網站公告內容為準。</footer>

  <dialog id="loginDialog">
    <button id="closeLoginBtn" type="button" aria-label="關閉">&times;</button>
    <h3 style="margin:0 44px 0 0;">管理員登入</h3>
    <p style="color:var(--muted);line-height:1.6;">請輸入活動管理員密碼。</p>
    <div class="login-row">
      <input id="passwordInput" type="password" placeholder="請輸入密碼">
      <button id="confirmLoginBtn">登入</button>
    </div>
  </dialog>
  <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
